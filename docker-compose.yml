services:
  db:
    image: postgres:16
    container_name: tienda_deportes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tienda_deportes_estructura.sql:/scripts/tienda_deportes_estructura.sql:ro
      - ./tienda_deportes_logica.sql:/scripts/tienda_deportes_logica.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend/TiendaDeportes.Api
      dockerfile: Dockerfile
    container_name: tienda_deportes_api
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=tienda_deportes;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tienda_deportes_frontend
    ports:
      - "8088:80"
    depends_on:
      - api

  # Consola de prueba rápida (opcional): docker compose run --rm console
  console:
    build:
      context: ./Backend/TiendaDeportes.Console
      dockerfile: Dockerfile
    profiles: ["console"]
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=tienda_deportes;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
