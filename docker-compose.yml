services:
  db:
    image: postgres:16
    container_name: tienda_deportes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tienda_deportes_estructura.sql:/scripts/tienda_deportes_estructura.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend/TiendaDeportes.Console
      dockerfile: Dockerfile
    container_name: tienda_deportes_backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=tienda_deportes;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
